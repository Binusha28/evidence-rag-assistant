
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evidence-rag-assistant"
version = "0.1.0"
description = "Evidence-grounded research assistant using retrieval-augmented generation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ollama>=0.6.3",
    "pymupdf>=2.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.67.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
